---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-cve-mitigations
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    kubernetes.io/description: Mitigating kernel vulnerabilities (CVE-2026-31431, CVE-2026-43284, CVE-2026-46300) with an eBPF DaemonSet.  This is a temporary workaround until the cluster can be updated to pick up a patched kernel.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kernel-ebpf-lsm-loader
  namespace: openshift-cve-mitigations
  annotations:
    kubernetes.io/description: Mitigating kernel vulnerabilities (CVE-2026-31431, CVE-2026-43284, CVE-2026-46300) with an eBPF DaemonSet.  This is a temporary workaround until the cluster can be updated to pick up a patched kernel.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:privileged
  namespace: openshift-cve-mitigations
  annotations:
    kubernetes.io/description: Mitigating kernel vulnerabilities (CVE-2026-31431, CVE-2026-43284, CVE-2026-46300) with an eBPF DaemonSet.  This is a temporary workaround until the cluster can be updated to pick up a patched kernel.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
- kind: ServiceAccount
  name: kernel-ebpf-lsm-loader
  namespace: openshift-cve-mitigations
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kernel-ebpf-lsm-loader
  namespace: openshift-cve-mitigations
  labels:
    app: kernel-ebpf-lsm-loader
  annotations:
    kubernetes.io/description: Mitigating kernel vulnerabilities (CVE-2026-31431, CVE-2026-43284, CVE-2026-46300) with an eBPF DaemonSet.  This is a temporary workaround until the cluster can be updated to pick up a patched kernel.
spec:
  selector:
    matchLabels:
      app: kernel-ebpf-lsm-loader
  template:
    metadata:
      labels:
        app: kernel-ebpf-lsm-loader
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: NotIn
                values:
                - arm64
                - ppc64le
                - s390x
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      serviceAccountName: kernel-ebpf-lsm-loader
      priorityClassName: system-node-critical
      tolerations:
      - operator: Exists
      containers:
      - name: blocker
        image: registry.redhat.io/openshift4/ose-block-copyfail-rhel9:latest
        env:
        - name: MITIGATIONS
          value: "all"
        securityContext:
          privileged: true
        volumeMounts:
        - name: bpf
          mountPath: /sys/fs/bpf
        - name: btf
          mountPath: /sys/kernel/btf/vmlinux
          readOnly: true
        - name: tracefs
          mountPath: /sys/kernel/tracing
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: bpf
        hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate
      - name: btf
        hostPath:
          path: /sys/kernel/btf/vmlinux
          type: File
      - name: tracefs
        hostPath:
          path: /sys/kernel/tracing
          type: Directory
      terminationGracePeriodSeconds: 5
